<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ediciones Especiales</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
</head>

<body>

    <!-- PANTALLA DE INICIO -->
    <div id="pantalla-inicio">
        <img src="./inicio.jpg" alt="Bienvenida">
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <main id="aplicacion" class="oculta">

        <section id="menu-disenos">

            <h1>EDICIONES ESPECIALES 💜</h1>

            <p>Elige tu diseño favorito</p>

            <div id="lista-disenos"></div>

        </section>

        <!-- VISTA PREVIA -->
        <div id="vista-previa" class="oculta">

            <div class="contenido-vista-previa">

                <img id="imagen-vista-previa" alt="Vista previa">

                <div class="botones-vista">

                    
            <button id="btnDescargar">
             ⬇️ DESCARGAR 💜
            </button>


                
<button
    type="button"
    id="btnAvisarEdicion"
    style="display:none;"
>
    🔔 AVÍSAME CUANDO ESTÉ DISPONIBLE
</button>

                    
          <button id="btnCerrar">
            CERRAR
           </button>


                </div>

            </div>

        </div>

    </main>
    
<!-- ==========================================
     VENTANA PARA COMPARTIR CALENDARIOS
     E1 - E8
     ========================================== -->

<div id="modalCompartirTikTok" class="oculta">

    <div class="contenidoCompartirTikTok">

        <h2>💜 ¡COMPARTE TU CALENDARIO! 💜</h2>

        <p>
            Comparte tu calendario favorito en TikTok
            y descárgalo gratis para disfrutarlo.
        </p>

        <p>
            Al presionar el botón, intentaremos
            descargar tu calendario y abrir
            las opciones para compartirlo en TikTok.
        </p>

        <button
            type="button"
            id="btnCompartirTikTok"
        >
            🎵 COMPARTIR EN TIKTOK
        </button>

        <button
            type="button"
            id="btnDescargaAlternativa"
            class="oculta"
        >
            ⬇️ DESCARGAR CALENDARIO
        </button>

        <button
            type="button"
            id="btnCerrarCompartir"
        >
            CERRAR
        </button>

        <p id="mensajeCompartirTikTok"></p>

    </div>

</div>

    <script src="./app.js"></script>

</body>
</html>
