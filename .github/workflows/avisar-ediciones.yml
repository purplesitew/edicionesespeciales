
# ==========================================
# EDICIONES ESPECIALES
# PRUEBA DE SUSCRIPTORES FIREBASE
# ==========================================

name: Avisar ediciones especiales

on:
  workflow_dispatch:
    inputs:
      edicion:
        description: "Selecciona la edición terminada"
        required: true
        type: choice
        options:
          - felicitacionjimininstarmy.jpg
          - felicitacionjiminkorean.jpg
          - felicitacionVinstaarmy.jpg
          - felicitacionsugainstaarmy.jpg
          - felicitacionJKinstaarmy.jpg
          - instaarmybank.jpg
          - instaarmybankplatinum.jpg
          - instaarmygolden.jpg
          - instaarmybienestar.jpg
          - diplomainstaarmy.jpg
          - CertificadodebautismoInstaarmy.jpg
          - welcomebts.jpg
          - runjininstaarmy.jpg
          - Mndiainstaarmy.jpg
          - instaarmyswim.jpg

permissions:
  contents: read

jobs:
  probar-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Firebase Admin
        run: npm install firebase-admin@13 --no-save

      - name: Comprobar suscriptores en Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EDICION: ${{ inputs.edicion }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore } = require("firebase-admin/firestore");

          async function probar() {

            const secreto = process.env.FIREBASE_SERVICE_ACCOUNT;

            if (!secreto) {
              throw new Error("Falta FIREBASE_SERVICE_ACCOUNT");
            }

            const cuenta = JSON.parse(secreto);

            if (cuenta.project_id !== "ediciones-especiales") {
              throw new Error("La credencial pertenece a otro proyecto");
            }

            initializeApp({
              credential: cert(cuenta)
            });

            const db = getFirestore();

            const usuarios = await db
              .collection("suscripciones")
              .listDocuments();

            const edicion = process.env.EDICION;
            const idEdicion = edicion.replace(/\.jpg$/i, "");

            let suscriptores = 0;
            let dispositivos = 0;

            for (const usuario of usuarios) {

              const solicitud = await usuario
                .collection("ediciones")
                .doc(idEdicion)
                .get();

              if (!solicitud.exists ||
                  solicitud.data().activa !== true) {
                continue;
              }

              suscriptores++;

              const registros = await usuario
                .collection("dispositivos")
                .get();

              registros.forEach((registro) => {

                const datos = registro.data();

                if (typeof datos.token === "string" &&
                    datos.token.length > 0) {
                  dispositivos++;
                }

              });

            }

            console.log("Conexión con Firebase correcta.");
            console.log("Edición:", edicion);
            console.log("Usuarios registrados:", usuarios.length);
            console.log("Suscriptores de esta edición:", suscriptores);
            console.log("Dispositivos para avisar:", dispositivos);
            console.log("MODO PRUEBA: no se enviaron notificaciones.");

          }

          probar().catch(error => {
            console.error("Falló la conexión:", error.message);
            process.exitCode = 1;
          });
          NODE
