
# ==========================================
# EDICIONES ESPECIALES
# GITHUB ACTIONS + FIREBASE
# ==========================================

name: Avisar ediciones especiales

on:
  workflow_dispatch:
    inputs:
      edicion:
        description: "Selecciona la edición terminada"
        required: true
        type: choice
        options:
          - felicitacionjimininstarmy.jpg
          - felicitacionjiminkorean.jpg
          - felicitacionVinstaarmy.jpg
          - felicitacionsugainstaarmy.jpg
          - felicitacionJKinstaarmy.jpg
          - instaarmybank.jpg
          - instaarmybankplatinum.jpg
          - instaarmygolden.jpg
          - instaarmybienestar.jpg
          - diplomainstaarmy.jpg
          - CertificadodebautismoInstaarmy.jpg
          - welcomebts.jpg
          - runjininstaarmy.jpg
          - Mndiainstaarmy.jpg
          - instaarmyswim.jpg

permissions:
  contents: read

jobs:
  probar-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Firebase Admin
        run: npm install firebase-admin@13 --no-save

      - name: Comprobar conexión con Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EDICION: ${{ inputs.edicion }}
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore } = require("firebase-admin/firestore");

          async function probar() {
            const secreto = process.env.FIREBASE_SERVICE_ACCOUNT;

            if (!secreto) {
              throw new Error("Falta FIREBASE_SERVICE_ACCOUNT");
            }

            const cuenta = JSON.parse(secreto);

            if (cuenta.project_id !== "ediciones-especiales") {
              throw new Error("La credencial pertenece a otro proyecto");
            }

            initializeApp({
              credential: cert(cuenta)
            });

            const db = getFirestore();

            const usuarios = await db
              .collection("suscripciones")
              .listDocuments();

            console.log("Conexión con Firebase correcta.");
            console.log("Edición:", process.env.EDICION);
            console.log("Registros encontrados:", usuarios.length);
            console.log("MODO PRUEBA: no se enviaron notificaciones.");
          }

          probar().catch(error => {
            console.error("Falló la conexión:", error.message);
            process.exitCode = 1;
          });
          NODE
